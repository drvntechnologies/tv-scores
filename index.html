<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Scores</title><style>
:root{--bg:#06080f;--tx:#f2f5fb;--mut:#8b95ab;--live:#ff3b4e;--win:#3ddc97;--loss:#ff6b7a}
*{box-sizing:border-box}
html{font-size:calc(var(--f,1)*min(.52083vw,.9259vh))}
html,body{margin:0;width:100%;max-width:100vw;height:100%;background:var(--bg);color:var(--tx);font-family:Inter,"SF Pro Display","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(90rem 50rem at 10% -10%,#16254a55,transparent),radial-gradient(90rem 60rem at 100% 110%,#3a1a5a44,transparent),var(--bg);padding:2.2rem 2.8rem;display:flex;flex-direction:column;gap:1.6rem}
header{display:flex;align-items:baseline;justify-content:space-between}
h1{margin:0;font-size:4rem;letter-spacing:.5px;font-weight:800}
h1 span{background:linear-gradient(90deg,#6cb6ff,#b58cff);-webkit-background-clip:text;background-clip:text;color:transparent}
#u{color:var(--mut);font-size:2.2rem}
#live{display:none;gap:1.4rem;flex-wrap:wrap}
#live.on{display:flex}
.lv{flex:1 1 38rem;display:flex;align-items:center;gap:1.4rem;padding:1.2rem 1.8rem;border-radius:1.8rem;background:linear-gradient(135deg,#ff3b4e33,#ffffff08);border:1px solid #ff3b4e88;box-shadow:0 0 2.8rem #ff3b4e33;font-size:2.6rem;font-weight:700}
.lv .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{flex:1;width:100%;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,1fr);gap:1.6rem}
.card{--c:#6cb6ff;position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:2.2rem;padding:1.6rem 1.8rem;
 background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,#0d1220) 0%,#0d1220 55%,#0a0e19 100%);
 border:1px solid #ffffff1a;box-shadow:0 1rem 3rem #0008, inset 0 1px 0 #ffffff14;backdrop-filter:blur(0.8rem)}
.card.hasl{border-color:#ff3b4eaa;box-shadow:0 0 3rem #ff3b4e44,0 1rem 3rem #0008}
.hd{display:flex;align-items:center;gap:1.2rem;padding-bottom:1rem;border-bottom:1px solid #ffffff1c}
.hd img{width:5.4rem;height:5.4rem;object-fit:contain;filter:drop-shadow(0 0.2rem 0.6rem #0009)}
.hd .t{min-width:0}
.nm{font-size:2.3rem;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec{font-size:2.2rem;font-weight:700;color:#fff}
.rec small{font-size:1.7rem;font-weight:500;color:var(--mut);margin-left:0.6rem}
.sec{font-size:1.5rem;letter-spacing:0.2rem;text-transform:uppercase;color:var(--mut);font-weight:700;margin:1rem 0 0.3rem;display:flex;align-items:center;gap:0.8rem}
.sec.l{color:var(--live)}
.g{display:flex;align-items:center;gap:0.9rem;padding:0.5rem 0;font-size:2.1rem;line-height:1.15}
.g img,.lv img{width:3rem;height:3rem;object-fit:contain;flex:none}
.g .o{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.g .o i{font-style:normal;color:var(--mut);font-weight:500;margin-right:0.5rem}
.g .r{text-align:right;font-weight:800;white-space:nowrap}
.g .r small{display:block;font-size:1.5rem;font-weight:500;color:var(--mut)}
.W{color:var(--win)}.L{color:var(--loss)}.D{color:#ffd166}
.badge{display:inline-flex;align-items:center;gap:0.7rem;padding:0.3rem 1.1rem;border-radius:99.9rem;background:var(--live);color:#fff;font-size:1.7rem;font-weight:800;letter-spacing:0.15rem}
.dot{width:1.1rem;height:1.1rem;border-radius:50%;background:#fff;animation:p 1.1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 #fff9}50%{opacity:.35;transform:scale(.7);box-shadow:0 0 0 0.8rem #fff0}}
.none{color:#5f6a82;font-size:1.9rem;padding:0.4rem 0}
.err{color:#ffb86b;font-size:1.9rem}

.card,.hd,.t,.g{min-width:0}.lv{min-width:0}
@media (max-aspect-ratio:3/2){.grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}}

#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;gap:1.6rem;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s}
.view.on{opacity:1;visibility:visible}
#dots{display:flex;gap:1rem}#dots i{width:1.3rem;height:1.3rem;border-radius:50%;background:#ffffff33;transition:background .4s,transform .4s}#dots i.on{background:#6cb6ff;transform:scale(1.35)}
.vt{flex:none;display:flex;align-items:baseline;gap:2rem;font-size:3.4rem;font-weight:800;letter-spacing:.1rem}
.vt span{font-size:2.2rem;color:var(--mut);font-weight:600;letter-spacing:0}
.cols{flex:1;min-height:0;display:grid;gap:2rem}
.tb{min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;border-radius:1.6rem;background:linear-gradient(160deg,#16213a,#0d1220);border:1px solid #ffffff1a;padding:.6rem 1.2rem}
.tb .cp{font-weight:800;color:#fff;letter-spacing:.1rem;display:flex;align-items:center}
.tb .rw{display:grid;align-items:center;column-gap:.5em;height:var(--rh);font-size:var(--fs);border-bottom:1px solid #ffffff10;white-space:nowrap}
.tb .rw>*{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tb .rw.h{color:var(--mut);font-weight:700;font-size:calc(var(--fs)*.8);border-bottom:1px solid #ffffff30}
.tb .rw .n{text-align:right;font-variant-numeric:tabular-nums}
.tb .rw.h .n,.tb .rw .c{text-align:center}
.tb .rw b{font-weight:800;color:#fff}
.tb .rw img{width:1.5em;height:1.5em;object-fit:contain}
.tb .rw .pt{font-weight:800;color:#fff}
.tb .rw.cut{border-bottom:2px dashed #ff3b4e99}
.tb .rw .up{color:var(--win)}.tb .rw .dn{color:var(--loss)}
#tk{flex:none;position:relative;height:9.6rem;margin:0 -2.8rem -2.2rem;overflow:hidden;background:linear-gradient(180deg,#101a30,#05070d);border-top:0.3rem solid #ff3b4e;box-shadow:0 -1rem 3rem #000a;display:flex;align-items:stretch}
#tl{flex:none;width:30rem;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 1.4rem;background:var(--cc,#c8102e);color:#fff;font-weight:900;font-size:3.4rem;line-height:1;letter-spacing:.15rem;text-transform:uppercase;box-shadow:0.8rem 0 2rem #000b;transition:transform .35s ease,opacity .35s ease}
#tl small{display:block;font-size:1.7rem;font-weight:700;letter-spacing:.2rem;opacity:.85;margin-top:.7rem}
#tl.out{transform:translateY(-35%);opacity:0}
#tl.pre{transform:translateY(35%);opacity:0;transition:none}
#tv{flex:1;position:relative;overflow:hidden;min-width:0}
#tr{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.cell{flex:none;display:flex;align-items:center;gap:1.6rem;height:100%;padding:0 2.6rem;border-right:1px solid #ffffff22;font-size:3.2rem;font-weight:800}
.tm2{display:flex;align-items:center;gap:.8rem}
.tm2 img{width:4.8rem;height:4.8rem;object-fit:contain}
.tm2 .ab{letter-spacing:.05rem}
.tm2 .rk{color:#ffd166;font-size:2rem;font-weight:800;margin-right:-.3rem}
.tm2 .s{font-variant-numeric:tabular-nums;color:#fff;margin-left:.3rem}
.tm2.lo{color:#9aa4ba}.tm2.lo .s{color:#9aa4ba}
.vs{color:var(--mut);font-size:2.2rem;font-weight:600}
.stt{display:flex;flex-direction:column;justify-content:center;gap:.4rem;font-size:2.3rem;font-weight:700;color:var(--mut);line-height:1.1;min-width:11rem}
.stt .ck{color:#ff8a96;font-weight:800}
.stt .fn{color:#fff;letter-spacing:.15rem;font-weight:800}
.stt .badge{font-size:1.9rem;padding:.3rem 1.2rem;align-self:flex-start}
.msg{color:var(--mut);font-size:2.6rem;font-weight:700;padding:0 3rem}
</style></head><body>
<header><h1><span>SCOREBOARD</span></h1><div style="display:flex;align-items:center;gap:2rem"><div id="dots"></div><div id="u"></div></div></header>
<div id="views"><div class="view on" id="v0"><div id="live"></div><div class="grid" id="g"></div></div></div><div id="tk"><div id="tl"><span id="tlt">SCORES</span></div><div id="tv"><div id="tr"><span class="msg">Loading scores…</span></div></div></div>
<script>
const E='https://site.web.api.espn.com/apis/site/v2/sports/',S='https://www.thesportsdb.com/api/v1/json/123/';
const AH='https://lscluster.hockeytech.com/feed/index.php?key=50c2cd9b5e18e390&client_code=ahl&lang=en&fmt=json&feed=modulekit&';
const T=[
{n:'Iowa Football',k:'espn',p:'football/college-football',id:2294},
{n:'Iowa Basketball',k:'espn',p:'basketball/mens-college-basketball',id:2294,off:'Season starts in November'},
{n:'Liberty Football',k:'espn',p:'football/college-football',id:2335},
{n:'Liberty Basketball',k:'espn',p:'basketball/mens-college-basketball',id:2335,off:'Season starts in November'},
{n:'Iowa State Football',k:'espn',p:'football/college-football',id:66},
{n:'Iowa State Basketball',k:'espn',p:'basketball/mens-college-basketball',id:66,off:'Season starts in November'},
{n:'Minnesota Wild',k:'espn',p:'hockey/nhl',id:'min'},
{n:'Iowa Wild (AHL)',k:'ahl'},
{n:'Alianza Lima',k:'peru',id:2680,sdb:138311},
{n:'Cienciano',k:'peru',id:3372,sdb:138319}];
const fmt=d=>d.toLocaleString([],{weekday:'short',month:'short',day:'numeric'})+' '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const day=d=>d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
const J=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};
const jsonp=u=>new Promise((res,rej)=>{const cb='cb'+Math.random().toString(36).slice(2),s=document.createElement('script');
 const to=setTimeout(()=>{cl();rej(new Error('timeout'))},12000);const cl=()=>{clearTimeout(to);delete window[cb];s.remove()};
 window[cb]=d=>{cl();res(d)};s.onerror=()=>{cl();rej(new Error('jsonp'))};s.src=u+'&callback='+cb;document.head.appendChild(s)});
const sc=c=>c.score==null?null:(typeof c.score==='object'?c.score.displayValue:c.score);
const logo=t=>t&&(t.logo||(t.logos&&t.logos[0]&&t.logos[0].href))||'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));
// normalized game: {t:Date, st:'pre'|'in'|'post', me:{..}, opp:{name,logo,score}, home:bool, det}
function mk(t,st,home,me,opp,det){return {t,st,home,me,opp,det}}
async function espn(x){
 const j=await J(E+x.p+'/teams/'+x.id+'/schedule');const tm=j.team||{};const g=[];
 for(const e of j.events||[]){const c=e.competitions[0],st=c.status.type.state;
  const me=c.competitors.find(z=>String(z.id)===String(tm.id)||z.team&&String(z.team.id)===String(tm.id)),op=c.competitors.find(z=>z!==me);if(!me||!op)continue;
  g.push(mk(new Date(e.date),st,me.homeAway==='home',{score:sc(me),win:me.winner},{name:op.team.shortDisplayName||op.team.displayName,logo:logo(op.team),score:sc(op)},st==='in'?c.status.type.shortDetail:null));}
 return {team:{logo:logo(tm),color:tm.color,rec:tm.recordSummary,sub:tm.standingSummary},games:g};}
async function peru(x){
 const [a,st,nx,ls]=await Promise.allSettled([espn({p:'soccer/per.1',id:x.id}),J('https://site.web.api.espn.com/apis/v2/sports/soccer/per.1/standings'),J(S+'eventsnext.php?id='+x.sdb),J(S+'eventslast.php?id='+x.sdb)]);
 if(a.status!=='fulfilled'&&nx.status!=='fulfilled')throw new Error('peru');
 const r=a.status==='fulfilled'?a.value:{team:{},games:[]};
 if(st.status==='fulfilled'){try{for(const ch of st.value.children||[])for(const en of ch.standings.entries){if(String(en.team.id)===String(x.id)){
  const m={};en.stats.forEach(s=>m[s.name]=s.value);r.team.rec=`${m.wins}-${m.ties}-${m.losses}`;r.team.sub=`#${m.rank} · ${m.points} pts · ${m.gamesPlayed} GP`;}}}catch(e){}}
 if(r.team.sub&&/^\d+(st|nd|rd|th) in/.test(r.team.sub))r.team.sub=r.team.sub.replace(' in Peruvian Liga 1','');
 const seen=g=>r.games.some(z=>Math.abs(z.t-g.t)<864e5/2&&z.opp.name.slice(0,4)===g.opp.name.slice(0,4));
 const add=(arr,key)=>{if(arr.status==='fulfilled')for(const e of arr.value[key]||[]){
  const home=String(e.idHomeTeam)===String(x.sdb),d=new Date(e.strTimestamp+'Z'),fin=e.intHomeScore!=null&&e.intHomeScore!=='';
  const o=home?{name:e.strAwayTeam,logo:e.strAwayTeamBadge}:{name:e.strHomeTeam,logo:e.strHomeTeamBadge};
  const ms=home?e.intHomeScore:e.intAwayScore,os=home?e.intAwayScore:e.intHomeScore;
  const g=mk(d,fin?'post':'pre',home,{score:fin?ms:null,win:fin?(+ms>+os):false},{...o,score:fin?os:null},null);
  if(!seen(g)&&(e.strStatus==='NS'||fin||e.strStatus==='FT'))r.games.push(g)}};
 add(nx,'events');add(ls,'results');
 r.team.logo=r.team.logo||'';return r;}
async function ahl(){
 const [tm,sc2]=await Promise.all([jsonp(AH+'view=teamsbyseason'),jsonp(AH+'view=schedule&team_id=389&season_id=94')]);
 const me=tm.SiteKit.Teamsbyseason.find(t=>t.id==='389');const g=[];
 for(const e of sc2.SiteKit.Schedule){const home=e.home_team==='389',pre=e.final!=='1'&&e.started!=='1',fin=e.final==='1';
  const o=home?'visiting':'home';const oid=home?e.visiting_team:e.home_team;
  g.push(mk(new Date(e.GameDateISO8601),fin?'post':pre?'pre':'in',home,{score:home?e.home_goal_count:e.visiting_goal_count,win:home?+e.home_goal_count>+e.visiting_goal_count:+e.visiting_goal_count>+e.home_goal_count,ext:fin&&/SO|OT/.test(e.game_status)},
   {name:e[o+'_team_name'],logo:'https://assets.leaguestat.com/ahl/logos/'+oid+'.png',score:home?e.visiting_goal_count:e.home_goal_count},fin?null:e.game_status));}
 let rec='',sub='';
 try{const st=await jsonp('https://lscluster.hockeytech.com/feed/index.php?key=50c2cd9b5e18e390&client_code=ahl&lang=en&fmt=json&feed=statviewfeed&view=teams&groupTeamsBy=division&context=overall&site_id=3&season=94&special=false&division=-1');
  for(const s of st[0].sections)for(const r of s.data)if(r.row.team_code==='IA'){const w=r.row;rec=`${w.wins}-${w.losses}-${+w.ot_losses+ +w.shootout_losses}`;sub=`#${w.rank} Central · ${w.points} pts`}}catch(e){}
 return {team:{logo:me.team_logo_url,color:'154734',rec,sub},games:g};}
function pick(gs){const now=Date.now(),wk=7*864e5;
 const live=gs.filter(g=>g.st==='in');
 const up=gs.filter(g=>g.st==='pre'&&g.t>now-36e5).sort((a,b)=>a.t-b.t).slice(0,2);
 const all=gs.filter(g=>g.st==='post').sort((a,b)=>b.t-a.t);
 let res=all.filter(g=>now-g.t<=wk).slice(0,2),old=false;
 if(!res.length&&all.length){res=[all[0]];old=true}
 return {live,up,res,old}}
const last={};
const row=(g,k)=>{const m=g.me,o=g.opp;let r='';
 if(k==='up')r=`<div class="r">${g.t.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}<small>${day(g.t)}</small></div>`;
 else{const w=m.win,tie=+m.score===+o.score&&!w;const cl=k==='live'?'':tie?'D':w?'W':'L';
  r=`<div class="r ${cl}">${k==='live'?'':(tie?'D ':w?'W ':'L ')}${esc(m.score)}-${esc(o.score)}<small>${k==='live'?esc(g.det):day(g.t)+(m.ext?' · OT/SO':'')}</small></div>`}
 return `<div class="g">${o.logo?`<img src="${esc(o.logo)}" alt="" onerror="this.style.visibility='hidden'">`:'<span style="width:30px"></span>'}<div class="o"><i>${g.home?'vs':'@'}</i>${esc(o.name)}</div>${r}</div>`};
function card(t,d){const p=d.err&&!d.data?null:pick(d.data.games),tm=d.data?d.data.team:{};
 const col=(tm.color&&/^[0-9a-f]{6}$/i.test(tm.color))?'#'+tm.color:'#6cb6ff';
 let h=`<div class="card${p&&p.live.length?' hasl':''}" style="--c:${col}"><div class="hd">${tm.logo?`<img src="${esc(tm.logo)}" alt="" onerror="this.style.visibility='hidden'">`:''}<div class="t"><div class="nm">${esc(t.n)}</div><div class="rec">${esc(tm.rec||(t.off?'Preseason':'-'))}<small>${esc(tm.sub||'')}</small></div></div></div>`;
 if(!p)return h+'<div class="err">Data unavailable, retrying</div></div>';
 if(p.live.length){h+=`<div class="sec l"><span class="badge"><span class="dot"></span>LIVE</span></div>`+p.live.map(g=>row(g,'live')).join('')}
 if(p.up.length)h+=`<div class="sec">Upcoming</div>`+p.up.map(g=>row(g,'up')).join('');
 if(p.res.length)h+=`<div class="sec">${p.old?'Last result':'Last 7 days'}</div>`+p.res.map(g=>row(g,'fin')).join('');
 if(!p.live.length&&!p.up.length&&!p.res.length)h+=`<div class="none">${esc(t.off||'No games in the last week or scheduled')}</div>`;
 return h+'</div>'}
async function load(){
 await Promise.all(T.map(async(t,i)=>{try{const d=await (t.k==='espn'?espn(t):t.k==='ahl'?ahl():peru(t));last[i]={data:d}}catch(e){console.warn(t.n,e.message);last[i]=last[i]&&last[i].data?last[i]:{err:1}}}));
 document.getElementById('g').innerHTML=T.map((t,i)=>card(t,last[i])).join('');
 const lv=[];T.forEach((t,i)=>{const d=last[i];if(d&&d.data)pick(d.data.games).live.forEach(g=>lv.push(`<div class="lv"><span class="badge"><span class="dot"></span>LIVE</span><div class="n">${esc(t.n)} ${g.home?'vs':'@'} ${esc(g.opp.name)}</div><div>${esc(g.me.score)}-${esc(g.opp.score)} · ${esc(g.det||'')}</div></div>`))});
 const L=document.getElementById('live');L.innerHTML=lv.join('');L.classList.toggle('on',lv.length>0);
 fit();document.getElementById('u').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
function fit(){const r=document.documentElement;let f=1.3;r.style.setProperty('--f',f);
 const bad=()=>[...document.querySelectorAll('.card')].some(c=>c.scrollHeight>c.clientHeight+1)||document.body.scrollWidth>innerWidth||document.body.scrollHeight>innerHeight+1;
 while(bad()&&f>.45){f-=.04;r.style.setProperty('--f',f.toFixed(2))}}
addEventListener('resize',fit);
load();setInterval(load,60000);
// ===== rotating views =====
const SV='https://site.web.api.espn.com/apis/v2/sports/',SR='https://site.web.api.espn.com/apis/site/v2/sports/';
const svData={},svStat={};window.svStat=svStat;
const stv=(e,n)=>{const s=(e.stats||[]).find(x=>x.name===n);return s?+s.value:0};
const tlogo=t=>(t.logos&&t.logos[0]&&t.logos[0].href)||t.logo||'';
const im=u=>u?`<img src="${esc(u)}" alt="" onerror="this.style.visibility='hidden'">`:'<span></span>';
async function svEntries(path,qs){const j=await J(SV+path+'/standings'+(qs||''));return j}
function rankTbl(r){const rk=r.ranks.slice(0,25).map(x=>{const t=x.team,d=x.previous?x.previous-x.current:0;
  return [`<b class="n">${x.current}</b>`,im(tlogo(t)),`<b>${esc(t.location||t.nickname)}</b>`,`<span class="c">${esc(x.recordSummary||'')}</span>`,`<span class="c ${d>0?'up':d<0?'dn':''}">${d>0?'▲'+d:d<0?'▼'+-d:'–'}</span>`]});
 const G='2.4em 1.6em 1fr 4.2em 3.2em',H=['#','','Team','Rec','Δ'];
 return [{g:G,h:H,rows:rk.slice(0,13)},{g:G,h:H,rows:rk.slice(13)}]}
async function svLoadAll(){
 const T={};
 const run=async(k,f)=>{try{T[k]=await f();svStat[k]='ok'}catch(e){console.warn('view',k,e.message);svStat[k]='error: '+e.message;if(svData[k])T[k]=svData[k]}};
 await Promise.all([
 run('ncaaf',async()=>{const j=await J(SR+'football/college-football/rankings');const r=j.rankings.find(x=>x.type==='ap')||j.rankings[0];
   return {title:'NCAAF AP Top 25',sub:r.occurrence.displayValue+' · '+new Date(r.date).toLocaleDateString([],{month:'short',day:'numeric'}),tables:rankTbl(r),cols:2}}),
 run('ncaam',async()=>{const j=await J(SR+'basketball/mens-college-basketball/rankings');const r=j.rankings.find(x=>x.type==='ap')||j.rankings[0];
   const d=new Date(r.date),old=Date.now()-d>120*864e5;
   return {title:'NCAA Men’s Basketball AP Top 25',sub:old?'Final poll of last season ('+d.toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})+') · 2026-27 preseason poll not released yet':'Preseason/Week poll · '+r.occurrence.displayValue,tables:rankTbl(r),cols:2}}),
 run('nhl',async()=>{const j=await svEntries('hockey/nhl');
   return {title:'NHL Standings',sub:'Dashed line = top 8 in conference',cols:2,tables:j.children.map(c=>{const es=c.standings.entries.slice().sort((a,b)=>(stv(a,'playoffSeed')||99)-(stv(b,'playoffSeed')||99)||stv(b,'points')-stv(a,'points'));
     return {cap:c.name.replace(' Conference',''),g:'2em 1.6em 1fr repeat(4,2.4em) 2.8em',h:['#','','Team','GP','W','L','OTL','PTS'],cutAt:8,
      rows:es.map((e,i)=>[`<span class="n">${i+1}</span>`,im(tlogo(e.team)),`<b>${esc(e.team.shortDisplayName||e.team.displayName)}</b>`,...['gamesPlayed','wins','losses','otLosses'].map(k=>`<span class="n">${stv(e,k)}</span>`),`<span class="n pt">${stv(e,'points')}</span>`])}})}}),
 run('nfl',async()=>{const j=await svEntries('football/nfl');
   return {title:'NFL Standings',sub:'Dashed line = 7 playoff seeds per conference',cols:2,tables:j.children.map(c=>{const es=c.standings.entries.slice().sort((a,b)=>(stv(a,'playoffSeed')||99)-(stv(b,'playoffSeed')||99)||stv(b,'winPercent')-stv(a,'winPercent'));
     return {cap:c.name.includes('American')?'AFC':'NFC',g:'2em 1.6em 1fr repeat(3,2.2em) 3.6em',h:['#','','Team','W','L','T','PCT'],cutAt:7,
      rows:es.map((e,i)=>[`<span class="n">${i+1}</span>`,im(tlogo(e.team)),`<b>${esc(e.team.shortDisplayName||e.team.displayName)}</b>`,`<span class="n">${stv(e,'wins')}</span>`,`<span class="n">${stv(e,'losses')}</span>`,`<span class="n">${stv(e,'ties')}</span>`,`<span class="n pt">${stv(e,'winPercent').toFixed(3).replace(/^0/,'')}</span>`])}})}}),
 run('ahl',async()=>{const d=await jsonp('https://lscluster.hockeytech.com/feed/index.php?key=50c2cd9b5e18e390&client_code=ahl&lang=en&fmt=json&feed=statviewfeed&view=teams&groupTeamsBy=division&context=overall&site_id=3&season=94&special=false&division=-1');
   const secs=d[0].sections;if(!secs||!secs.length)throw new Error('empty');
   return {title:'AHL Standings',sub:'By division',cols:secs.length,tables:secs.map(s=>({cap:s.headers.name.properties.title.replace(' Division',''),w:17,g:'1.4em 1fr repeat(4,1.8em) 2.2em',h:['#','Team','GP','W','L','OT','PTS'],
     rows:s.data.map(x=>{const r=x.row;return [`<span class="n">${r.rank}</span>`,`<b>${esc(r.team_code)}</b>`,`<span class="n">${r.games_played}</span>`,`<span class="n">${r.wins}</span>`,`<span class="n">${r.losses}</span>`,`<span class="n">${+r.ot_losses+ +r.shootout_losses}</span>`,`<span class="n pt">${r.points}</span>`]})}))}}),
 run('liga',async()=>{
   const [a,c]=await Promise.all([svEntries('soccer/per.1','?season=2026&seasontype=1'),svEntries('soccer/per.1')]);
   const ea=a.children[0].standings.entries,ec=c.children[0].standings.entries;
   const mkE=e=>({id:e.team.id,name:e.team.shortDisplayName||e.team.displayName,logo:tlogo(e.team),pj:stv(e,'gamesPlayed'),w:stv(e,'wins'),d:stv(e,'ties'),l:stv(e,'losses'),gf:stv(e,'pointsFor'),ga:stv(e,'pointsAgainst'),pts:stv(e,'points')});
   const A=ea.map(mkE),C=ec.map(mkE),m={};
   [...A,...C].forEach(x=>{const o=m[x.id]||(m[x.id]={...x,pj:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});if(o!==x)['pj','w','d','l','gf','ga','pts'].forEach(k=>o[k]+=x[k])});
   const srt=l=>l.slice().sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);
   const mt=l=>{const L=srt(l),G='2em 1.6em 1fr repeat(5,2.4em) 2.8em',H=['#','','Equipo','PJ','G','E','P','DG','PTS'];
    const rows=L.map((x,i)=>[`<span class="n">${i+1}</span>`,im(x.logo),`<b>${esc(x.name)}</b>`,`<span class="n">${x.pj}</span>`,`<span class="n">${x.w}</span>`,`<span class="n">${x.d}</span>`,`<span class="n">${x.l}</span>`,`<span class="n">${x.gf-x.ga>0?'+':''}${x.gf-x.ga}</span>`,`<span class="n pt">${x.pts}</span>`]);
    const h=Math.ceil(rows.length/2);return [{g:G,h:H,rows:rows.slice(0,h)},{g:G,h:H,rows:rows.slice(h)}]};
   return {ap:{title:'Liga 1 Perú · Apertura 2026',sub:'Final table (ESPN)',tables:mt(A),cols:2},cl:{title:'Liga 1 Perú · Clausura 2026',sub:'In progress (ESPN)',tables:mt(C),cols:2},ac:{title:'Liga 1 Perú · Tabla Acumulada 2026',sub:'Apertura + Clausura, calculated from both ESPN tables',tables:mt(Object.values(m)),cols:2}}})]);
 const L=T.liga||{};
 Object.assign(svData,{ncaaf:T.ncaaf,ncaam:T.ncaam,nhl:T.nhl,ahl:T.ahl,ap:L.ap,cl:L.cl,ac:L.ac,nfl:T.nfl,liga:T.liga});
 svRender()}
const ORDER=['cards','ncaaf','ncaam','nhl','ahl','ap','cl','ac','nfl'];
function svHtml(v){return `<div class="vt">${esc(v.title)}<span>${esc(v.sub||'')}</span></div><div class="cols" style="grid-template-columns:repeat(${v.cols},minmax(0,1fr))">`+v.tables.map(t=>`<div class="tb" data-n="${t.rows.length}" data-cap="${t.cap?1:0}" data-w="${t.w||0}">${t.cap?`<div class="cp">${esc(t.cap)}</div>`:''}<div class="rw h" style="grid-template-columns:${t.g}">${t.h.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`+t.rows.map((r,i)=>`<div class="rw${t.cutAt&&i+1===t.cutAt?' cut':''}" style="grid-template-columns:${t.g}">${r.join('')}</div>`).join('')+'</div>').join('')+'</div>'}
function svRender(){const root=document.getElementById('views');
 for(const k of ORDER){if(k==='cards')continue;let el=document.getElementById('v-'+k);const v=svData[k];
  if(!v){if(el)el.remove();continue}
  if(!el){el=document.createElement('div');el.className='view';el.id='v-'+k;root.appendChild(el)}
  el.innerHTML=svHtml(v)}
 svLayout();svDots()}
function svLayout(){document.querySelectorAll('.view .tb').forEach(tb=>{const n=+tb.dataset.n,cap=tb.dataset.cap==='1';
  const avail=tb.clientHeight-parseFloat(getComputedStyle(tb).paddingTop)*2,rows=n+1+(cap?1.2:0);const rh=Math.floor(avail/rows*10)/10;
  tb.style.setProperty('--rh',rh+'px');const wl=+tb.dataset.w?(tb.clientWidth-24)/+tb.dataset.w:1e9;tb.style.setProperty('--fs',Math.min(wl,rh*.62,parseFloat(getComputedStyle(document.documentElement).fontSize)*3)+'px');
  const cp=tb.querySelector('.cp');if(cp){cp.style.height=rh*1.2+'px';cp.style.fontSize=Math.min(rh*.7,parseFloat(getComputedStyle(document.documentElement).fontSize)*3.4)+'px'}})}
let svCur=0;const svList=()=>ORDER.filter(k=>k==='cards'||svData[k]);
function svDots(){const l=svList();document.getElementById('dots').innerHTML=l.map(k=>`<i class="${k===l[svCur%l.length]?'on':''}"></i>`).join('')}
function svShow(i){const l=svList();svCur=((i%l.length)+l.length)%l.length;
 document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===(l[svCur]==='cards'?'v0':'v-'+l[svCur])));svDots()}
window.svShow=svShow;window.svList=svList;
const still=/still/.test(location.hash);
setInterval(()=>{if(!still)svShow(svCur+1)},20000);
addEventListener('resize',()=>{svLayout()});
svLoadAll();setInterval(svLoadAll,300000);
// ===== ESPN BottomLine-style ticker =====
const LG=[
 {tag:'NCAAF',sub:'Top 25',c:'#c8102e',p:'football/college-football',q:'groups=80&limit=300',rank:true},
 {tag:'NHL',c:'#0b5cab',p:'hockey/nhl'},
 {tag:'NFL',c:'#013369',p:'football/nfl'},
 {tag:'AHL',c:'#0d8a5e',ahl:true},
 {tag:'LIGA 1',sub:'Perú',c:'#d91023',p:'soccer/per.1'},
 {tag:'SUDAMERICANA',c:'#0a7bb8',p:'soccer/conmebol.sudamericana'},
 {tag:'LIBERTADORES',c:'#9a6b00',p:'soccer/conmebol.libertadores'}];
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const lima=d=>d.toLocaleString('en-US',{timeZone:'America/Lima',weekday:'short',hour:'numeric',minute:'2-digit'}).replace(',','').toUpperCase();
async function tkEspn(L){
 const days=[];for(let i=-3;i<=5;i++)days.push(ymd(new Date(Date.now()+i*864e5)));
 const rs=await Promise.allSettled(days.map(d=>J(E+L.p+'/scoreboard?'+(L.q?L.q+'&':'')+'dates='+d)));
 if(rs.every(r=>r.status!=='fulfilled'))throw new Error('all failed');
 const seen=new Set(),out=[];
 for(const r of rs)if(r.status==='fulfilled')for(const e of r.value.events||[]){if(seen.has(e.id))continue;seen.add(e.id);
  const c=e.competitions[0],cs=c.competitors,h=cs.find(x=>x.homeAway==='home'),a=cs.find(x=>x.homeAway==='away');if(!h||!a)continue;
  const rk=x=>{const n=x.curatedRank&&x.curatedRank.current;return n&&n<=25?n:0};
  if(L.rank&&!rk(h)&&!rk(a))continue;
  const st=e.status.type.state,mk2=x=>({n:x.team.abbreviation||x.team.shortDisplayName,lg:logo(x.team),r:L.rank?rk(x):0,s:x.score==null?'':String(x.score),w:!!x.winner});
  out.push({id:e.id,t:new Date(e.date),st,a:mk2(a),h:mk2(h),det:e.status.type.shortDetail,fin:e.status.type.detail});}
 return out}
async function tkAhl(){
 const d=await jsonp(AH+'view=scorebar&numberofdaysback=3&numberofdaysahead=7');
 const lg=id=>id?'https://assets.leaguestat.com/ahl/logos/'+id+'.png':'';
 return d.SiteKit.Scorebar.map(x=>{const st=x.GameStatus==='4'?'post':x.GameStatus==='2'?'in':'pre',hg=+x.HomeGoals,vg=+x.VisitorGoals;
  return {id:x.ID,t:new Date(x.GameDateISO8601),st,a:{n:x.VisitorCode||x.VisitorNickname,lg:lg(x.VisitorID),r:0,s:String(x.VisitorGoals),w:st==='post'&&vg>hg},h:{n:x.HomeCode||x.HomeNickname,lg:lg(x.HomeID),r:0,s:String(x.HomeGoals),w:st==='post'&&hg>vg},
   det:st==='in'?(x.Intermission==='1'?'INT ':'')+(x.PeriodNameShort||'')+' '+x.GameClock:(/SO|OT/.test(x.GameStatusString||'')?'F/'+(x.GameStatusString.match(/SO|OT/)||[''])[0]:'Final')}})}
const tkLast={};
async function tkLoad(){
 await Promise.all(LG.map(async L=>{try{tkLast[L.tag]=await(L.ahl?tkAhl():tkEspn(L))}catch(e){console.warn('ticker',L.tag,e.message);if(!tkLast[L.tag])tkLast[L.tag]=[]}}))}
function tkGames(L){const now=Date.now(),cut=now-3*864e5,g=tkLast[L.tag]||[];
 const live=g.filter(x=>x.st==='in').sort((a,b)=>a.t-b.t),
  up=g.filter(x=>x.st==='pre'&&x.t>=now-36e5).sort((a,b)=>a.t-b.t),
  fin=g.filter(x=>x.st==='post'&&x.t>=cut).sort((a,b)=>b.t-a.t);
 return [...live,...up,...fin].slice(0,14)}
function tkCell(x){
 const tmh=(t,lose)=>`<div class="tm2${lose?' lo':''}">${t.lg?`<img src="${esc(t.lg)}" alt="" onerror="this.style.visibility='hidden'">`:''}${t.r?`<span class="rk">${t.r}</span>`:''}<span class="ab">${esc(t.n)}</span>${x.st==='pre'?'':`<span class="s">${esc(t.s)}</span>`}</div>`;
 let stt;
 if(x.st==='in')stt=`<div class="stt"><span class="badge"><span class="dot"></span>LIVE</span><span class="ck">${esc(x.det)}</span></div>`;
 else if(x.st==='pre')stt=`<div class="stt"><span>${esc(lima(x.t))}</span><span style="font-size:1.8rem">LIMA (UTC-5)</span></div>`;
 else stt=`<div class="stt"><span class="fn">${/OT|SO/.test(x.det)?esc(x.det.toUpperCase()):'FINAL'}</span></div>`;
 return `<div class="cell">${tmh(x.a,x.st==='post'&&x.h.w)}<span class="vs">${x.st==='pre'?'@':''}</span>${tmh(x.h,x.st==='post'&&x.a.w)}${stt}</div>`}
// scheduler
const tkS={i:-1,phase:'idle',x:0,w:0,t0:0,vw:0};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tkNext(){ // returns next league with games, or null
 for(let k=1;k<=LG.length;k++){const i=(tkS.i+k)%LG.length;if(tkGames(LG[i]).length)return i}return null}
async function tkStart(L2,i){
 const tl=document.getElementById('tl'),tr=document.getElementById('tr'),tlt=document.getElementById('tlt');
 const first=tkS.i<0||tl.dataset.tag!==undefined&&false;
 tkS.phase='label';tl.classList.add('out');await sleep(first?0:350);
 tkS.i=i;tl.dataset.tag=L2.tag;tl.style.setProperty('--cc',L2.c);tlt.innerHTML=esc(L2.tag)+(L2.sub?`<small>${esc(L2.sub)}</small>`:'');
 tr.innerHTML=tkGames(L2).map(tkCell).join('');tkS.x=tkS.vw=document.getElementById('tv').clientWidth;tr.style.transform=`translateX(${tkS.x}px)`;
 tkS.w=tr.scrollWidth;
 tl.classList.add('pre');tl.classList.remove('out');void tl.offsetWidth;tl.classList.remove('pre');
 tkS.long=tkS.w>tkS.vw;tkS.t0=0;tkS.phase=tkS.long?'scroll':'slide'}
function tkFrame(t){
 const tr=document.getElementById('tr'),rem=parseFloat(getComputedStyle(document.documentElement).fontSize);
 const dt=tkS.t0?Math.min(t-tkS.t0,100):0;tkS.t0=t;
 if(tkS.phase==='scroll'){tkS.x-=dt/1000*18*rem;tr.style.transform=`translateX(${tkS.x}px)`;if(tkS.x<=-tkS.w){tkS.phase='busy';tkAdvance()}}
 else if(tkS.phase==='slide'){ // short list: ease in, dwell, then advance
  tkS.el=(tkS.el||0)+dt;const k=Math.min(tkS.el/700,1),e=1-Math.pow(1-k,3);tkS.x=tkS.vw+((tkS.vw-tkS.w)/2-tkS.vw)*e;tr.style.transform=`translateX(${tkS.x}px)`;
  if(tkS.el>=700+7000){tkS.el=0;tkS.phase='busy';tkAdvance()}}
 else if(tkS.phase==='idle'){tkS.el=0;if(tkS.start&&tkNext()!==null)tkAdvance()}
 requestAnimationFrame(tkFrame)}
async function tkAdvance(){tkS.el=0;const n=tkNext();
 if(n===null){document.getElementById('tr').innerHTML='<span class="msg">No games to show right now</span>';document.getElementById('tr').style.transform='none';tkS.phase='idle';return}
 await tkStart(LG[n],n)}
tkS.start=false;requestAnimationFrame(tkFrame);
tkLoad().then(()=>{tkS.start=true;fit()});setInterval(tkLoad,60000);
</script></body></html>
